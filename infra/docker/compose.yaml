services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: intellery-postgres

    environment:
      POSTGRES_USER: intellery
      POSTGRES_PASSWORD: intellery
      POSTGRES_DB: intellery

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: intellery-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: intellery
      MINIO_ROOT_PASSWORD: intellery123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/data

    restart: unless-stopped

  minio-init:
    image: minio/mc
    container_name: intellery-minio-init

    depends_on:
      - minio

    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 intellery intellery123; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;

      mc mb --ignore-existing local/intellery;

      exit 0;
      "

  redis:
    image: redis:7
    container_name: intellery-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    restart: unless-stopped    

volumes:
  postgres-data:
  minio-data:
  redis-data:
